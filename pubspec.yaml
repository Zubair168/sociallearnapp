name: sociallearnapp
description: "A social learning platform with Firebase Auth, Firestore courses, and video playback."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.17

  # State management
  provider: ^6.1.2

  # Firebase & Notifications
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # Local Storage & Preferences
  shared_preferences: ^2.3.5

  # Video
  video_player: ^2.9.5
  chewie: ^1.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
